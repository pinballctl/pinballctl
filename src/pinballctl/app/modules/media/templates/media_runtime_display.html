<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <script src="{{ url_for('media.static', filename='js/media_scene_renderer.js') }}?v=20260322c"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
      }
      #viewport {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        overflow: hidden;
        background: #000;
      }
      #layers {
        position: absolute;
        inset: 0;
      }
      #overlays {
        position: absolute;
        inset: 0;
      }
      .media-layer {
        position: absolute;
        inset: 0;
        background: #000;
      }
      .media-layer video,
      .media-layer img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: #9aa0aa;
        font-size: 2.2vw;
        letter-spacing: 0.02em;
        background: radial-gradient(ellipse at center, #0f172a 0%, #000 75%);
      }
      #empty.show {
        display: flex;
      }
      .ov {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
        line-height: 1.1;
        transform-origin: 50% 50%;
        box-sizing: border-box;
      }
      .ov-text {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .media-preview-overlay-text-content {
        display: block;
        width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
        line-height: 1.1;
      }
      .ov-img {
        width: 100%;
        height: 100%;
        display: block;
      }
      .ov-frame-img {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="viewport">
        <div id="layers"></div>
        <div id="overlays"></div>
      </div>
      <div id="empty" class="show">No active media scene</div>
    </div>

    <script>
      (() => {
        const displayId = {{ display_id|tojson }};
        const qs = new URLSearchParams(window.location.search || "");
        const kioskToken = String(qs.get("kiosk_token") || "").trim();
        const sceneId = String(qs.get("sceneId") || "").trim();
        const instanceId = String(qs.get("instanceId") || qs.get("sessionId") || "").trim();
        const surface = String(qs.get("surface") || "").trim().toLowerCase();
        const tokenParams = new URLSearchParams();
        if (kioskToken) tokenParams.set("kiosk_token", kioskToken);
        if (sceneId) tokenParams.set("sceneId", sceneId);
        if (instanceId) tokenParams.set("instanceId", instanceId);
        if (surface) tokenParams.set("surface", surface);
        const tokenQs = tokenParams.toString() ? `?${tokenParams.toString()}` : "";
        const fontLink = document.createElement("link");
        fontLink.rel = "stylesheet";
        fontLink.href = `/api/media/fonts/stylesheet${kioskToken ? `?kiosk_token=${encodeURIComponent(kioskToken)}` : ""}`;
        document.head.appendChild(fontLink);
        const viewport = document.getElementById("viewport");
        const layersRoot = document.getElementById("layers");
        const overlaysRoot = document.getElementById("overlays");
        const empty = document.getElementById("empty");
        let pollMs = 150;
        let attachedInstanceId = instanceId;
        const surfaceId = `surface_${Date.now()}_${Math.random().toString(16).slice(2, 10)}`;
        let lastPayload = null;
        let lastNonEmptyPayload = null;
        let lastNonEmptyAtMs = 0;
        const completingLayerIds = new Set();

        function runtimeApiUrl(path) {
          const suffix = kioskToken ? `${path.includes("?") ? "&" : "?"}kiosk_token=${encodeURIComponent(kioskToken)}` : "";
          return `${path}${suffix}`;
        }

        function layoutViewport(display) {
          const sw = Math.max(1, Number(window.innerWidth || document.documentElement.clientWidth || 0));
          const sh = Math.max(1, Number(window.innerHeight || document.documentElement.clientHeight || 0));
          const dw = Math.max(1, Number(display?.width || 1920));
          const dh = Math.max(1, Number(display?.height || 1080));
          const ratio = dw / dh;
          let vw = sw;
          let vh = Math.round(vw / ratio);
          if (vh > sh) {
            vh = sh;
            vw = Math.round(vh * ratio);
          }
          viewport.style.width = `${Math.max(64, vw)}px`;
          viewport.style.height = `${Math.max(64, vh)}px`;
        }

        function runtimeFontScale(display, active) {
          const rect = viewport.getBoundingClientRect();
          const vw = Math.max(1, Number(rect.width || 0));
          const vh = Math.max(1, Number(rect.height || 0));
          // Scale directly from live viewport size so font behavior is stable
          // when the window is resized or moved between displays.
          const refW = 1280;
          const refH = 720;
          const sx = vw / refW;
          const sy = vh / refH;
          const scale = Math.min(sx, sy);
          if (!Number.isFinite(scale) || scale <= 0) return 1;
          return Math.max(0.05, Math.min(4, scale));
        }

        const renderer = window.PinballctlMediaSceneRenderer.createSceneRenderer({
          layersRoot,
          overlayRoot: overlaysRoot,
          layerClassName: "media-layer",
          overlayClassName: "ov",
          overlayFrameClassName: "",
          overlayImageLayerClassName: "",
          overlayTextLayerClassName: "",
          imageClassName: "ov-img",
          frameImageClassName: "ov-frame-img",
          assetUrlFor(assetId) {
            return assetId ? `/api/media/assets/file/${encodeURIComponent(assetId)}${tokenQs}` : "";
          },
          onVideoEnded(layer) {
            notifyLayerComplete(layer);
          },
        });

        function rerenderLastPayload() {
          if (!lastPayload) return;
          render(lastPayload);
        }

        async function attachSurface(targetInstanceId) {
          const iid = String(targetInstanceId || "").trim();
          if (!iid) return;
          try {
            await fetch(runtimeApiUrl("/api/media/surface/attach"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ instanceId: iid, surfaceId }),
            });
            attachedInstanceId = iid;
          } catch (_) {}
        }

        async function notifyLayerComplete(layer) {
          const layerId = String(layer?.layerId || "");
          if (!layerId || !layer?.sessionId || completingLayerIds.has(layerId)) return;
          completingLayerIds.add(layerId);
          try {
            await fetch(runtimeApiUrl("/api/media/complete"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                displayId,
                sessionId: String(layer.sessionId || ""),
                sceneId: String(layer?.scene?.id || ""),
              }),
            });
          } catch (_) {
            // keep polling as fallback
          }
        }

        function render(payload) {
          const nowMs = Date.now();
          const incoming = payload || null;
          if (payload?.shouldClose && surface !== "embedded") {
            sendSurfaceLeave();
            try {
              window.close();
            } catch (_) {}
            return;
          }
          const incomingLayers = Array.isArray(incoming?.layers) ? incoming.layers : [];
          if (!incomingLayers.length && lastNonEmptyPayload && (nowMs - lastNonEmptyAtMs) < 2000) {
            return;
          }
          lastPayload = incoming;
          if (incomingLayers.length) {
            lastNonEmptyPayload = incoming;
            lastNonEmptyAtMs = nowMs;
          }
          const layers = Array.isArray(payload?.layers) ? payload.layers : [];
          const payloadInstanceId = String(payload?.active?.instanceId || payload?.active?.sessionId || "").trim();
          if (payloadInstanceId && payloadInstanceId !== attachedInstanceId) {
            attachSurface(payloadInstanceId);
          }
          layoutViewport(payload?.display || null);
          if (!layers.length) empty.classList.add("show");
          else empty.classList.remove("show");
          renderer.render({
            layers,
            overlayValues: payload?.overlayValues || {},
            fontScale: runtimeFontScale(payload?.display || null, payload?.active || null),
          });
        }

        window.addEventListener("resize", rerenderLastPayload);
        let leaveSent = false;
        function sendSurfaceLeave() {
          // Embedded lifecycle is owned by the Live View page. Avoid iframe-level
          // pagehide/unload detach because it can fire during focus/layout churn.
          if (surface === "embedded") return;
          if (leaveSent) return;
          const iid = String(attachedInstanceId || instanceId || "").trim();
          const payload = iid
            ? JSON.stringify({ instanceId: iid, surfaceId, surface: surface || "windowed" })
            : (surface === "embedded" ? JSON.stringify({ displayId, surface: "embedded" }) : "");
          if (!payload) return;
          leaveSent = true;
          try {
            const blob = new Blob([payload], { type: "application/json" });
            const ok = navigator.sendBeacon(runtimeApiUrl("/api/media/surface/leave"), blob);
            if (ok) return;
          } catch (_) {
            // fall through to fetch fallback
          }
          try {
            fetch(runtimeApiUrl("/api/media/surface/leave"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: payload,
              keepalive: true,
            }).catch(() => {});
          } catch (_) {
            // best effort only
          }
        }
        window.addEventListener("pagehide", sendSurfaceLeave);
        window.addEventListener("beforeunload", sendSurfaceLeave);
        if (instanceId) {
          attachSurface(instanceId);
        }

        async function poll() {
          let timeoutId = null;
          try {
            const controller = new AbortController();
            timeoutId = window.setTimeout(() => controller.abort(), Math.max(300, pollMs * 2));
            const pollParams = new URLSearchParams(tokenParams);
            const pollInstanceId = String(attachedInstanceId || instanceId || "").trim();
            if (pollInstanceId) pollParams.set("instanceId", pollInstanceId);
            if (surfaceId) pollParams.set("surfaceId", surfaceId);
            const pollQs = pollParams.toString() ? `?${pollParams.toString()}` : "";
            const r = await fetch(`/api/media/runtime/display/${encodeURIComponent(displayId)}${pollQs}`, {
              cache: "no-store",
              signal: controller.signal,
            });
            const j = await r.json();
            if (j && j.ok) {
              const nextPoll = Number(j?.settings?.runtimePollMs || 150);
              pollMs = Number.isFinite(nextPoll) ? Math.max(40, Math.min(5000, Math.round(nextPoll))) : 150;
              render(j);
            }
          } catch (_) {
            // keep last frame
          } finally {
            if (timeoutId) window.clearTimeout(timeoutId);
            window.setTimeout(poll, pollMs);
          }
        }

        poll();
      })();
    </script>
  </body>
</html>
