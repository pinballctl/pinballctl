{% extends "core/templates/base.html" %}

{% block content %}
  <div class="row justify-content-center align-items-center h-100">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm" style="max-width:500px">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Login</h3>

          {% with messages = get_flashed_messages() %}
            {% if messages %}
              <div class="alert alert-danger" role="alert">
                {{ messages[0] }}
              </div>
            {% endif %}
          {% endwith %}

          <form method="post" action="{{ url_for('core.login') }}" class="vstack gap-3">
            <div>
              <label for="username" class="form-label">Username</label>
              <input id="username" name="username" required class="form-control" autofocus>
            </div>

            <div>
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <input id="password" name="password" type="password" required class="form-control" autocomplete="current-password">
                <button
                  id="toggle-password-visibility"
                  type="button"
                  class="btn btn-outline-secondary"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <i id="toggle-password-icon" class="fa fa-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 d-inline-flex justify-content-center align-items-center gap-2">
              <i class="fa fa-right-to-bracket"></i>
              <span>Login</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    (() => {
      const passwordInput = document.getElementById("password");
      const toggleButton = document.getElementById("toggle-password-visibility");
      const toggleIcon = document.getElementById("toggle-password-icon");

      if (!passwordInput || !toggleButton || !toggleIcon) return;

      toggleButton.addEventListener("click", () => {
        const shouldShow = passwordInput.type === "password";
        passwordInput.type = shouldShow ? "text" : "password";
        toggleIcon.classList.toggle("fa-eye", !shouldShow);
        toggleIcon.classList.toggle("fa-eye-slash", shouldShow);
        toggleButton.setAttribute("aria-pressed", shouldShow ? "true" : "false");
        toggleButton.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
      });
    })();
  </script>
{% endblock %}
