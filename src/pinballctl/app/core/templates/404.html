{% extends "core/templates/base.html" %}
{% block title %} · Not Found{% endblock %}

{% block content %}
<section class="error-shell d-flex align-items-center justify-content-center py-4">
  <div class="error-card card p-4 p-md-5 text-center">
    <div class="error-code">404</div>
    <h1 class="h3 mb-2">Page not found</h1>
    <p class="text-secondary mb-3">
      The requested path does not exist.
    </p>
    <div class="error-path mb-4">
      <code>{{ missing_path or request.path }}</code>
    </div>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a class="btn btn-primary" href="/">Go home</a>
      <button class="btn btn-outline-secondary" type="button" onclick="window.history.back()">Go back</button>
    </div>
  </div>
</section>
{% endblock %}
