<text x="50" y="840" font-size="20" fill="#243942" text-anchor="start" >Gate: 6 × 29 × 40 plywood in 7 mm guides; lift 30. Trough transport cover removes for use.</text>
<text x="50" y="875" font-size="18" fill="#6d6660" text-anchor="start" >Continuous L fence. Prove the 30 mm turn and beam timing before gluing. Exact lens and fitting holes come from received parts.</text>
