<text x="930" y="165" font-size="21" fill="#243942" text-anchor="start" >THREE DISTINCT HEIGHTS</text>
<text x="930" y="203" font-size="18" fill="#243942" text-anchor="start" >Carrier boards: z=6–51</text>
<text x="930" y="233" font-size="18" fill="#243942" text-anchor="start" >Interface: z=60–89</text>
<text x="930" y="263" font-size="18" fill="#243942" text-anchor="start" >Power connectors: z=65–89</text>
<text x="930" y="330" font-size="21" fill="#243942" text-anchor="start" >REMOVABLE PANEL</text>
<text x="930" y="368" font-size="18" fill="#243942" text-anchor="start" >Four screws land on plywood cleats.</text>
<text x="930" y="398" font-size="18" fill="#243942" text-anchor="start" >Their coordinates avoid controls:</text>
<text x="930" y="428" font-size="18" fill="#243942" text-anchor="start" >(249,143)  (347,207)</text>
<text x="930" y="458" font-size="18" fill="#243942" text-anchor="start" >(143,325)  (347,330)</text>
<text x="930" y="530" font-size="21" fill="#243942" text-anchor="start" >SERVICE HARNESS</text>
<text x="930" y="568" font-size="18" fill="#243942" text-anchor="start" >Allow 150–200 mm relaxed loops.</text>
<text x="930" y="598" font-size="18" fill="#243942" text-anchor="start" >Retain WAGOs with saddles/ties.</text>
<text x="930" y="628" font-size="18" fill="#243942" text-anchor="start" >Keep levers and Pi fan accessible.</text>
<text x="930" y="658" font-size="18" fill="#243942" text-anchor="start" >Route bundles around button tails.</text>
<text x="930" y="730" font-size="21" fill="#243942" text-anchor="start" >CONDITIONAL FIT</text>
<text x="930" y="768" font-size="18" fill="#243942" text-anchor="start" >LCD below panel; reserve down to z=65.</text>
<text x="930" y="798" font-size="18" fill="#243942" text-anchor="start" >ESP stack must remain below z=50.</text>
<text x="930" y="828" font-size="18" fill="#243942" text-anchor="start" >No physical assembly has been tested.</text>
<text x="60" y="1015" font-size="20" fill="#243942" text-anchor="start" >Grey circles include a nominal 24 mm wiring zone around each Ø12 switch; rear depth to z=60 is conditional.</text>
<text x="60" y="1050" font-size="20" fill="#243942" text-anchor="start" >Connector bodies fit the two rows; their leads exit into the adjacent gaps and turn downward.</text>
<text x="60" y="1085" font-size="19" fill="#6d6660" text-anchor="start" >Natural plywood supports and top are removable by hand tools. All placement dimensions are design allowances.</text>
</svg>