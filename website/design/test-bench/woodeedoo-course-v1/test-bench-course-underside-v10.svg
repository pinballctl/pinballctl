<text x="930" y="165" font-size="21" fill="#243942" text-anchor="start" >THREE DISTINCT HEIGHTS</text>
<text x="930" y="203" font-size="18" fill="#243942" text-anchor="start" >Carrier / power stack: z=6–58</text>
<text x="930" y="233" font-size="18" fill="#243942" text-anchor="start" >Interface: z=60–89</text>
<text x="930" y="263" font-size="18" fill="#243942" text-anchor="start" >Power connectors: z=65–89</text>
<text x="930" y="330" font-size="21" fill="#243942" text-anchor="start" >REMOVABLE PANEL</text>
<text x="930" y="368" font-size="18" fill="#243942" text-anchor="start" >MDF pad sizes / fixings pending.</text>
<text x="930" y="398" font-size="18" fill="#243942" text-anchor="start" >Fixing centres: reference only.</text>
<text x="930" y="428" font-size="18" fill="#243942" text-anchor="start" >(249,143)  (347,207)</text>
<text x="930" y="458" font-size="18" fill="#243942" text-anchor="start" >(143,325)  (347,330)</text>
<text x="930" y="530" font-size="21" fill="#243942" text-anchor="start" >SERVICE HARNESS</text>
<text x="930" y="568" font-size="18" fill="#243942" text-anchor="start" >Normal bundles: 150–200 mm loops.</text>
<text x="930" y="598" font-size="18" fill="#243942" text-anchor="start" >LED data: short; unplug before lifting.</text>
<text x="930" y="628" font-size="18" fill="#243942" text-anchor="start" >Retain WAGOs with saddles/ties.</text>
<text x="930" y="658" font-size="18" fill="#243942" text-anchor="start" >Keep levers and Pi fan accessible.</text>
<text x="930" y="688" font-size="18" fill="#243942" text-anchor="start" >Route bundles around button tails.</text>
<text x="930" y="730" font-size="21" fill="#243942" text-anchor="start" >CONDITIONAL FIT</text>
<text x="930" y="768" font-size="18" fill="#243942" text-anchor="start" >LCD rear z≥65; Pi stack z≤58.</text>
<text x="930" y="798" font-size="18" fill="#243942" text-anchor="start" >7 mm nominal gap; measure / load-test.</text>
<text x="930" y="828" font-size="18" fill="#243942" text-anchor="start" >ESP stack must remain below z=50.</text>
<text x="930" y="858" font-size="18" fill="#243942" text-anchor="start" >No physical assembly has been tested.</text>
<text x="60" y="1015" font-size="20" fill="#243942" text-anchor="start" >10 × 12mm Momentary Blue LED High Head buttons; grey Ø24 wire zones. Rear depth to z=60 is conditional.</text>
<text x="60" y="1050" font-size="20" fill="#243942" text-anchor="start" >Each flipper pair: one blue input button + one yellow MOSFET-switched lamp. Lamp wired rear allowance: 35 mm.</text>
<text x="60" y="1085" font-size="19" fill="#6d6660" text-anchor="start" >6 / 12 mm MDF. Small pad envelopes are placement references; final fixings require a clearance check.</text>
</svg>