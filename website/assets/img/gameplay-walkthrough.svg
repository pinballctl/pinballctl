<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1140" role="img" aria-labelledby="title desc"><title id="title">Two routes through a pinball game</title><desc id="desc">Two independent branches: flipper button through an ESP32-S3 local rule to a flipper coil; bumper switch through Pi rules to points and sound, with a planned counter and threshold leading to a backglass media scene. Counter and threshold functionality is not currently available.</desc><defs><marker id="mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67e8c3"/></marker><marker id="peach" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ffae71"/></marker></defs><g font-family="system-ui,sans-serif" font-size="23" text-anchor="middle" fill="#e4f3ef"><rect x="1" y="1" width="398" height="358" rx="22" fill="#10202f" stroke="#355568"/><text x="200" y="38" fill="#ffae71">Local hardware response</text><rect x="30" y="60" width="340" height="64" rx="14" fill="#142b38" stroke="#ffae71" stroke-width="2"/><text x="200" y="100.0">Flipper button</text><path d="M200 126V151" stroke="#ffae71" stroke-width="3" fill="none" marker-end="url(#peach)"/><rect x="30" y="160" width="340" height="72" rx="14" fill="#142b38" stroke="#ffae71" stroke-width="2"/><text x="200" y="204.0">ESP32-S3 local rule</text><path d="M200 234V259" stroke="#ffae71" stroke-width="3" fill="none" marker-end="url(#peach)"/><rect x="30" y="268" width="340" height="64" rx="14" fill="#142b38" stroke="#ffae71" stroke-width="2"/><text x="200" y="308.0">Flipper coil</text><rect x="1" y="390" width="398" height="749" rx="22" fill="#10202f" stroke="#355568"/><text x="200" y="427" fill="#67e8c3">Pi gameplay response</text><rect x="30" y="450" width="340" height="64" rx="14" fill="#142b38" stroke="#67e8c3" stroke-width="2"/><text x="200" y="490.0">Bumper switch</text><path d="M200 516V541" stroke="#67e8c3" stroke-width="3" fill="none" marker-end="url(#mint)"/><rect x="30" y="550" width="340" height="64" rx="14" fill="#142b38" stroke="#67e8c3" stroke-width="2"/><text x="200" y="590.0">Pi rules</text><path d="M200 616V641" stroke="#67e8c3" stroke-width="3" fill="none" marker-end="url(#mint)"/><rect x="30" y="650" width="340" height="64" rx="14" fill="#142b38" stroke="#67e8c3" stroke-width="2"/><text x="200" y="690.0">Points + sound</text><path d="M200 716V741" stroke="#67e8c3" stroke-width="3" fill="none" marker-end="url(#mint)" stroke-dasharray="5 5"/><rect x="30" y="750" width="340" height="82" rx="14" fill="#142b38" stroke="#ffae71" stroke-width="2" stroke-dasharray="7 5"/><text x="200" y="785.0">Counter</text><text x="200" y="813.0">Planned functionality</text><path d="M200 834V859" stroke="#67e8c3" stroke-width="3" fill="none" marker-end="url(#mint)" stroke-dasharray="5 5"/><rect x="30" y="868" width="340" height="82" rx="14" fill="#142b38" stroke="#ffae71" stroke-width="2" stroke-dasharray="7 5"/><text x="200" y="903.0">Threshold condition</text><text x="200" y="931.0">Planned functionality</text><path d="M200 952V977" stroke="#67e8c3" stroke-width="3" fill="none" marker-end="url(#mint)" stroke-dasharray="5 5"/><rect x="30" y="986" width="340" height="82" rx="14" fill="#142b38" stroke="#67e8c3" stroke-width="2"/><text x="200" y="1021.0">Backglass video /</text><text x="200" y="1049.0">media scene</text><text x="200" y="1105" font-size="18" fill="#ffae71">Counter / threshold: not available yet</text></g></svg>
