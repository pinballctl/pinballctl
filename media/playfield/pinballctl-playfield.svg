<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1200" viewBox="0 0 700 1200">
  <defs>
    <linearGradient id="deck" x2=".78" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#172a38"/>
      <stop offset=".55" stop-color="#101e29"/>
      <stop offset="1" stop-color="#0d1823"/>
    </linearGradient>
    <radialGradient id="wash" cx=".39" cy=".38" r=".73">
      <stop stop-color="#2c5a59" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2c5a59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="guide" x2="0" y2="1">
      <stop stop-color="#285052"/>
      <stop offset="1" stop-color="#1a303b"/>
    </linearGradient>
    <linearGradient id="sling" x2="0" y2="1">
      <stop stop-color="#254747"/>
      <stop offset="1" stop-color="#19303b"/>
    </linearGradient>
    <linearGradient id="lock-inlet" gradientUnits="userSpaceOnUse" x1="0" y1="98" x2="0" y2="172">
      <stop stop-color="#10212b" stop-opacity="0"/>
      <stop offset=".24" stop-color="#10212b" stop-opacity=".04"/>
      <stop offset=".61" stop-color="#10212b" stop-opacity=".32"/>
      <stop offset="1" stop-color="#10212b" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="lock-well" gradientUnits="userSpaceOnUse" cx="141.5" cy="135" r="31">
      <stop stop-color="#0d1c26" stop-opacity=".88"/>
      <stop offset=".53" stop-color="#0d1c26" stop-opacity=".54"/>
      <stop offset="1" stop-color="#0d1c26" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbit-opening" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1"
                    gradientTransform="translate(557 147) rotate(47) scale(84 25)">
      <stop offset=".53" stop-color="black"/>
      <stop offset="1" stop-color="white"/>
    </radialGradient>
    <linearGradient id="orbit-top-fade" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="159">
      <stop stop-color="black"/>
      <stop offset="1" stop-color="black" stop-opacity="0"/>
    </linearGradient>
    <filter id="lock-edge-fade" filterUnits="userSpaceOnUse" x="100" y="65" width="120" height="115">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <mask id="lock-shading" maskUnits="userSpaceOnUse" x="0" y="0" width="700" height="1200">
      <path d="M0 0H700V1200H0Z" fill="white"/>
      <path d="M190 103C178 112 168 123 168 135Q168 143 166 146" fill="none"
            stroke="black" stroke-width="23" stroke-linecap="round" filter="url(#lock-edge-fade)"/>
    </mask>
    <mask id="orbit-shading" maskUnits="userSpaceOnUse" x="0" y="0" width="700" height="1200">
      <path d="M0 0H700V1200H0Z" fill="url(#orbit-opening)"/>
      <path d="M0 0H700V159H0Z" fill="url(#orbit-top-fade)"/>
    </mask>
  </defs>

  <path fill="url(#deck)" d="M0 0h700v1200H0z"/>
  <path fill="url(#wash)" d="M0 0h700v1200H0z"/>

  <!-- Outline of the upper orbit and full-length shooter lane. -->
  <path d="M18 1092V254C18 241 23 227 32 211C79 95 193 25 330 25
           C525 25 681 179 681 373V1092H651V373
           C651 196 508 53 330 53C198 53 87 129 45 238
           C38 257 37 273 37 288V1092Z"
        fill="#162c37" mask="url(#orbit-shading)"/>
  <path d="M18 1092H37M681 1092H651V373
           M651 373C651 307.51 631.423 246.675 597.74 196.015
           M95.455 155.146C73.930 179.547 56.760 207.480 45.000 238.000
           C38 257 37 273 37 288V1092"
        fill="none" stroke="#34545e" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 1092V254C18 241 23 227 32 211C79 95 193 25 330 25
           C525 25 681 179 681 373V1092"
        fill="none" stroke="#567c78" stroke-width="3.3" stroke-linecap="round"/>
  <path d="M666 430V998" stroke="#426765" stroke-width="1.5" opacity=".65"/>

  <!-- Upper side guides. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M41 267C53 193 83 135 127 127Q143 122 152 137L162 160V263
             Q162 274 151 280L126 300Q116 307 111 323L107 334H41Z"
          fill="url(#guide)" stroke="#3f686a" stroke-width="2.5"/>
    <path d="M55 252C70 201 96 160 124 147" fill="none" stroke="#64a293" stroke-width="2.5"/>
    <path d="M440 379V246Q440 232 452 221L518 156Q531 143 545 154
             C600 215 626 325 630 443L632 590H573
             C588 525 610 453 595 391C586 353 561 333 529 341
             Q500 348 465 386Z"
          fill="url(#guide)" stroke="#3f686a" stroke-width="2.5"/>
    <path d="M456 265V249Q456 241 463 234L522 175" fill="none" stroke="#64a293" stroke-width="2.5"/>
  </g>

  <!-- The lock pocket opens to the orbit and tapers into a drop-out. -->
  <path d="M163.03 65.34C156 88 145 101 132 111C122 119 116 126 116 136
           C116 145 121 152 127 156C132 160 131 164 131 170
           C131 179 152 179 152 170C152 164 152 160 157 156
           C164 151 168 144 168 135C168 123 178 112 190 103Z"
        fill="url(#lock-inlet)" mask="url(#lock-shading)"/>
  <path d="M163.03 65.34C156 88 145 101 132 111C122 119 116 126 116 136
           C116 145 121 152 127 156C132 160 131 164 131 170
           M165.5 146C163.5 150 160.5 153.5 157 156
           C152 160 152 164 152 170"
        fill="none" stroke="#3f686a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="141.5" cy="135" r="31" fill="url(#lock-well)"/>
  <path d="M125 138C126 143 129 147 134 150M157 138C156 143 153 147 149 150"
        fill="none" stroke="#64a293" stroke-opacity=".61" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="141.5" cy="170" rx="10.5" ry="5.75" fill="#0d1c26" stroke="#3f686a" stroke-width="2"/>
  <path d="M133 173Q141.5 178 150 173"
        fill="none" stroke="#64a293" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>

  <!-- A small upright target faces the lower playfield. -->
  <g transform="translate(403 407) rotate(6)">
    <path d="M-20 -13H20Q25 -13 25 -8V8Q25 14 19 15H-19Q-25 14 -25 8V-8Q-25 -13 -20 -13Z"
          fill="url(#guide)" stroke="#3f686a" stroke-width="2.5"/>
    <path d="M-18 -6H18Q20 -6 20 -4V6Q20 8 18 8H-18Q-20 8 -20 6V-4Q-20 -6 -18 -6Z"
          fill="#182f3a"/>
    <path d="M-17 10H17" fill="none" stroke="#64a293" stroke-opacity=".75"
          stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Quiet collars leave the live bumper colours as the strongest marks. -->
  <g fill="#142732" stroke="#4c7575" stroke-width="2.25">
    <circle cx="158" cy="456" r="37"/>
    <circle cx="564" cy="416" r="30"/>
    <circle cx="484" cy="646" r="37"/>
  </g>

  <!-- Lower side guides and slingshots, with a clear central play area. -->
  <g fill="url(#sling)" stroke="#406467" stroke-width="2.5" stroke-linejoin="round">
    <path d="M37 393Q49 383 56 398L90 625Q92 639 78 644L62 649Q49 652 45 637L29 413Q28 400 37 393Z"/>
    <path d="M35 690Q43 680 54 690L84 810Q87 820 79 827L55 851Q40 862 30 849V706Q30 696 35 690Z"/>
    <path d="M599 696Q603 684 616 689Q625 691 625 704V848Q617 862 605 852L573 826Q565 819 568 809Z"/>
    <path d="M64 923Q67 903 81 911Q87 914 98 927L204 1061Q220 1081 205 1088Q199 1090 190 1089L73 1080Q64 1079 64 1067Z"/>
    <path d="M586 923Q583 903 569 911Q563 914 552 927L446 1061Q430 1081 445 1088Q451 1090 460 1089L577 1080Q586 1079 586 1067Z"/>
  </g>
  <g fill="none" stroke="#6ba897" stroke-width="2.5" stroke-linecap="round" opacity=".77">
    <path d="M78 931L78 1057Q78 1065 86 1066L177 1073"/>
    <path d="M572 931L572 1057Q572 1065 564 1066L473 1073"/>
  </g>

  <!-- The brand lockup sits between the lower guides. -->
  <g transform="translate(249 878)" opacity=".75">
    <g transform="scale(.82)">
      <g fill="none" stroke="#67e8c3" stroke-width="2.8" stroke-linecap="round">
        <path d="M4 19H22.2M8 29H22.2"/>
        <circle cx="32" cy="24" r="11"/>
      </g>
      <circle cx="32" cy="24" r="6" fill="#ecf3f8"/>
    </g>
    <text x="47" y="27" fill="#dce9ef" font-family="Helvetica Neue, sans-serif" font-weight="bold" font-size="25" letter-spacing=".25">pinball<tspan fill="#67e8c3">CTL</tspan></text>
  </g>

  <!-- Apron and open drain. The flippers and plunger come from the layout. -->
  <path d="M0 1086H37L280 1200H0ZM700 1086H615L365 1200H700Z" fill="#0a141e"/>
  <path d="M0 1086H37L280 1200M700 1086H615L365 1200"
        fill="none" stroke="#3b605f" stroke-width="2.5"/>
  <path d="M304 1148Q325 1127 346 1148V1179H304Z" fill="#11212a" stroke="#3b605f" stroke-width="2"/>
</svg>
