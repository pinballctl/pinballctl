<text x="1350" y="432" font-size="19" fill="#243942" text-anchor="start" >21 mm</text>
<text x="1060" y="545" font-size="20" fill="#243942" text-anchor="middle" >27 mm ball / 30 mm clear lane</text>
<text x="850" y="590" font-size="18" fill="#243942" text-anchor="start" >Sensor heads screw to small wooden pads.</text>
<text x="850" y="620" font-size="18" fill="#243942" text-anchor="start" >Drill beam holes through rails; allow adjustment.</text>
<text x="850" y="650" font-size="18" fill="#243942" text-anchor="start" >Three beams spaced 27 mm along the trough.</text>
<text x="50" y="740" font-size="20" fill="#243942" text-anchor="start" >Gate: thin plywood flap sliding vertically between screwed-on guide strips; about 30 mm lift.</text>
<text x="50" y="778" font-size="19" fill="#6d6660" text-anchor="start" >Prototype the corner, gate and beam timing before fixing rails permanently. No 3D printing or custom metal trough.</text>
