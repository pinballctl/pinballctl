<text x="50" y="55" font-size="30" fill="#243942" text-anchor="start" >HOW IT FASTENS TOGETHER</text>
<text x="50" y="92" font-size="21" fill="#536a75" text-anchor="start" >Straight cuts, drilled holes, glued timber cleats and removable screw-mounted panels</text>
