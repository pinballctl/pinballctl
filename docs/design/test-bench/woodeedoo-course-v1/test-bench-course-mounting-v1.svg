<text x="210" y="152" font-size="19" fill="#243942" text-anchor="start" >6 mm removable console — screws into cleats</text>
<text x="210" y="226" font-size="19" fill="#243942" text-anchor="start" >Panel top 95 mm above original inner bottom</text>
<text x="210" y="600" font-size="19" fill="#243942" text-anchor="start" >6 mm carrier / load-spreading base</text>
<text x="210" y="657" font-size="19" fill="#243942" text-anchor="start" >Original box base is only 3 mm: no short screws into it alone</text>
<text x="305" y="489" font-size="18" fill="#243942" text-anchor="start" >Electronics on M2.5 / M3 standoffs</text>
<line x1="190" y1="553" x2="280" y2="553" stroke="#65757b" stroke-width="1" />
<text x="290" y="558" font-size="17" fill="#243942" text-anchor="start" >Retaining cleats fix carrier to pine side walls</text>
<text x="850" y="170" font-size="23" fill="#243942" text-anchor="start" >TROUGH SENSOR SECTION</text>
<rect x="880" y="480" width="500" height="25" fill="#c8ab7e" stroke="#5f6f77" stroke-width="1" />
<rect x="925" y="330" width="60" height="150" fill="#aa8558" stroke="#5f6f77" stroke-width="1" />
<rect x="1135" y="330" width="60" height="150" fill="#aa8558" stroke="#5f6f77" stroke-width="1" />
