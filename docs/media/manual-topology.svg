<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Pinball CTL component responsibilities</title><desc id="desc">A browser authors the project on the Raspberry Pi. The Pi bridge exchanges framed JSON over USB with the ESP32-S3. Physical inputs report to the ESP, which controls outputs and enforces hardware safety limits.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#67e8c3" stroke-width="1.5"/></marker></defs><rect width="960" height="270" rx="16" fill="#0b1520"/><g fill="#152935" stroke="#426574"><rect x="24" y="56" width="210" height="130" rx="12"/><rect x="318" y="56" width="280" height="130" rx="12"/><rect x="682" y="56" width="250" height="130" rx="12"/></g><g fill="#ecf3f8" font-family="system-ui,sans-serif" text-anchor="middle"><g font-size="23" font-weight="700"><text x="129" y="92">Browser</text><text x="458" y="92">Raspberry Pi</text><text x="807" y="92">ESP32-S3</text></g><g font-size="17" fill="#b4c5d0"><text x="129" y="126">Author and inspect</text><text x="129" y="154">the project</text><text x="458" y="126">Application + bridge</text><text x="458" y="154">Rules, audio and displays</text><text x="807" y="126">Real-time I/O</text><text x="807" y="154">Output safety limits</text></g><g font-size="16" fill="#67e8c3"><text x="276" y="38">Network</text><text x="639" y="38">USB</text><text x="458" y="226">Framed JSON: commands, status and events</text><text x="807" y="226">Physical inputs and outputs</text></g></g><g stroke="#67e8c3" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M245 120H307"/><path d="M610 120H670"/></g></svg>