name: Build website and docs
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish main website to GitHub Pages (requires Pages and domain setup)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Markdown==3.7
      - run: python website/utils/build-site.py
      - run: python website/utils/check-site.py
      - uses: actions/upload-artifact@v4
        with:
          name: docs-domain-holding-page
          path: dist/docs-holding/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site/
  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy main website
        id: deployment
        uses: actions/deploy-pages@v4
