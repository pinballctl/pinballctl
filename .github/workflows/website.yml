name: Build website and docs
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish main website to GitHub Pages (requires Pages and domain setup)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install Markdown==3.7 Pillow==12.0.0
      - run: python media/website/utils/build-site.py --output build/site
      - run: python media/website/utils/check-site.py --site build/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site/
      - name: Remove website build files
        if: always()
        run: python -c "import shutil; shutil.rmtree('build/site', ignore_errors=True)"
  deploy:
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy main website
        id: deployment
        uses: actions/deploy-pages@v5
